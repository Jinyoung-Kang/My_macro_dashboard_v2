spring:
  # 계정 메일(가입 인증·비밀번호 재설정). MAIL_HOST가 비면 메일이 필요한 두 기능만 꺼집니다(ADR 0010).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  application:
    name: macro-dashboard-backend

  # 정기 작업(@Scheduled) 스레드 수. Spring Boot 기본은 1개라, 결정 작업이 Claude를 부르는 몇 분(claude-timeout-seconds 300) 동안
  # 리스크 점검(5분 트레일링 스탑)·알림·국면 기록이 그 뒤에 줄을 섰습니다. 같은 작업은 fixedDelay라 스스로 겹치지 않고, 서로 겹치는
  # 작업(결정·리스크 점검)은 장부 잠금으로 줄을 섭니다. 5개인 까닭: 🧪 장중 확인 호출(최대 300초, 계좌2 단계 2)이 한국 결정 창의 호출과
  # 겹쳐도 리스크 점검이 줄 서지 않게(계좌2 명세 §5-2).
  task:
    scheduling:
      pool:
        size: 5

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/macrodash}
    username: ${DATABASE_USER:macro}
    password: ${DATABASE_PASSWORD:macro}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jackson:
    default-property-inclusion: always
    # 날짜는 숫자(타임스탬프)가 아니라 ISO 문자열로. Jackson 3에서는 날짜 기능이 datatype.datetime으로 옮겨졌습니다.
    datatype:
      datetime:
        write-dates-as-timestamps: false

  # Spring 기본 필터 FormContentFilter를 끕니다(QA-069). 인증(SessionFilter)보다 먼저 모든 경로에서 돌며
  # PUT·PATCH·DELETE의 form 본문을 상한 없이 통째로 문자열로 읽어, 로그인 없이 큰 본문 몇 개로 힙을 고갈시킬 수
  # 있었습니다(본문 상한 SessionFilter.capBody보다 앞). 이 앱의 PUT·PATCH·DELETE 처리기는 form 파라미터를 읽지 않습니다.
  mvc:
    formcontent:
      filter:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  # JSON 응답 압축. 거시 지표 개요·환율 5년 차트는 한 번에 250KB 안팎이라
  # 휴대폰·와이파이에서 체감 차이가 큽니다. 2KB 미만은 압축 비용이 더 커서 제외.
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 2048
  # 오류 응답에 예외 문구를 싣지 않습니다(예전에는 SQL 문장까지 나갔습니다).
  # API 오류 형식은 web/ApiExceptionHandler · web/ErrorResponseConfig가 맞춥니다.
  error:
    include-message: never

dashboard:
  # 처음 기동할 때 계정이 없으면 이 둘로 운영자 계정을 만듭니다(ADR 0010). 계정이 생긴 뒤에는 읽지 않습니다.
  # 둘 중 하나라도 비었거나 비밀번호가 옛 공개 기본값(admin1234@)이면 만들지 않고 로그로 안내합니다.
  password: ${APP_PASSWORD:}
  owner-email: ${OWNER_EMAIL:}
  # 계정 메일의 보낸 사람 주소(비면 MAIL_USERNAME)
  mail-from: ${MAIL_FROM:}
  # 메일 속 링크의 화면 주소(비면 FRONTEND_ORIGIN의 첫 값)
  public-url: ${PUBLIC_URL:}
  session-minutes: ${SESSION_MINUTES:720}
  # HTTPS로만 접속할 때 true (세션 쿠키에 Secure). http://에서 켜면 로그인이 안 됩니다.
  cookie-secure: ${COOKIE_SECURE:false}
  # 데모 열람(ADR 0013) — 비면 꺼짐(기본·로컬). AWS 배포에서만 앞단 프록시가 접근 코드를 확인한 요청에
  # X-Demo-Viewer 헤더로 이 값을 실어 보내면 로그인 없이 읽기 전용으로 엽니다. 쓰면 32자 이상이어야 기동합니다.
  demo-viewer-token: ${DASHBOARD_DEMO_VIEWER_TOKEN:}
  # 로컬 무로그인(ADR 0016) — 켜면 이 맥(localhost·127.0.0.1·[::1])에서 온 쿠키 없는 요청을 첫 운영자 계정으로 엽니다.
  # 기본은 끔. 로컬 docker-compose.yml만 켜고(LOCAL_NO_LOGIN), AWS·QA 오버레이는 false로 고정합니다. 켜면 화면·API 포트는
  # 127.0.0.1에만 열립니다. 데모 열람 토큰·Secure 쿠키·앞단 헤더 신뢰·이 맥 밖의 화면 주소 중 하나라도 있으면 기동하지 않습니다.
  local-no-login: ${DASHBOARD_LOCAL_NO_LOGIN:false}

  # auto | store_only | live_only
  #   auto       저장본이 신선하면 사용, 오래되면 수집기에 수집 요청
  #   store_only 저장본만 사용 (화면이 절대 외부를 기다리지 않음)
  #   live_only  신선해도 읽을 때마다 수집 요청(비동기, 태스크별 30초 쿨다운) — 저장본이 있으면 그대로 보여 줌 (디버깅용)
  read-mode: ${DASHBOARD_READ_MODE:auto}

  # 캐시를 놓친 비싼 계산(전체 요약 텍스트·기관·13F 조합·국면·스코어카드)을 동시에 몇 개까지 돌릴지(QA-131, read.ComputedCache).
  # 0이면 자동 = 코어 수의 절반, 최소 1(AWS 2 vCPU면 1). 넘친 요청은 2초 기다린 뒤 429. 음수면 기동하지 않습니다.
  compute:
    max-concurrent: ${COMPUTE_MAX_CONCURRENT:0}

  collector-url: ${COLLECTOR_URL:http://localhost:8000}
  collector-token: ${COLLECTOR_API_TOKEN:}
  collector-timeout-seconds: ${COLLECTOR_TIMEOUT_SECONDS:90}

  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  frontend-port: ${FRONTEND_PORT:3000}

  # 🧪 모의 알고리즘 매매(운영자 전용, 명세 docs/specs/2026-10-24-paper-trading-spec.md). 슬리피지·스탑 비율 같은 값은 여기가 아니라
  # DB 설정 한 행(paper_settings)이고, 여기는 재기동해야 바뀌는 값만 둡니다. 출발일이 거래일이 아니거나 현금이 0 이하면 기동하지 않습니다.
  paper:
    enabled: ${PAPER_ENABLED:true}          # false면 정기 작업(리스크 점검·결정·출발일 종가 얼리기·실행 감사·장중 확인)이 일하지 않음(통합 테스트는 false). 수동 실행은 그대로
    start-date: "2026-10-23"                # 네 책의 출발(사후 체결) 거래일 — 명세 D2
    initial-cash: 100000                    # 책마다(달러) — D1
    kr:                                     # 🇰🇷 한국 책(2단계 명세 K1·K25·K28) — 재기동해야 바뀌는 값
      start-date: ${PAPER_KR_START_DATE:}   # 네 계좌의 출발 거래일 S(S 22:30 결정 → S+1 시가). 기본값 없음 — 비면 한국 초기화·출발 막힘(미국 기동은 그대로). 기동 때는 형식(yyyy-MM-dd)만, 거래일 검사는 한국 초기화·출발 때(kr_holidays + KrxCalendar)
      initial-cash: 100000000               # 한국 계좌마다(원, 정수) — K1
    risk-interval-ms: 300000                # 리스크 점검 주기(5분). 새 관측치(paper.quotes, 1시간마다)가 있을 때만 일함
    risk-initial-delay-ms: 90000
    decision-interval-ms: 600000            # 결정 작업 주기(10분). 세션 다음 날 07:30 KST(설정 decisionTimeKst)부터 그 거래일 결정을 한 번
    decision-initial-delay-ms: 120000
    review-interval-ms: 1800000             # 주간 복기 작업 주기(30분). 그 주 토요일 09:00 KST 뒤 확정 종가가 들어오면 그 주 복기를 한 번(2단계 D)
    review-initial-delay-ms: 180000
    exec-audit-interval-ms: 300000          # 🧪 실행 감사 주기(5분, 미국 Claude 계좌2 실험 단계 0 — ADR 0022). 계좌1 주문의 메뉴 반사실·1분봉 지연을 적고, 새로 적었을 때만 기록
    exec-audit-initial-delay-ms: 150000
    checkpoint-interval-ms: 60000           # 🧪 장중 확인 작업 주기(60초, 미국 Claude 계좌2 단계 2 — ADR 0022). PLANNED 행이 있을 때만 읽고, 확인 시각 +2~+20분에 한 번 부름
    checkpoint-initial-delay-ms: 165000
    claude-timeout-seconds: 300             # Claude 책 호출 하나의 대기 한도(초). 출력 16,000토큰·effort high가 다 차도 끝나는 여유

  ai:
    # Claude API (Haiku 5.5) — platform.claude.com에서 발급. 자동 탐색의 첫 엔진입니다.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    nvidia-api-key: ${NVIDIA_API_KEY:}
    cerebras-api-key: ${CEREBRAS_API_KEY:}
    cloudflare-account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    cloudflare-api-token: ${CLOUDFLARE_API_TOKEN:}
    # 추론형 모델(gpt-oss, DeepSeek-R1 등)은 응답까지 몇 분이 걸릴 수 있습니다.
    # 아래 한도는 "엔진을 직접 고른 경우" 생성 전체(번역 포함)에 적용됩니다 — 응답이 한국어가 아니면 번역은 남은 시간만
    # 받고, 15초 미만으로 남았으면 원문을 그대로 보여 줍니다(QA-094).
    timeout-seconds: ${AI_TIMEOUT_SECONDS:240}
    # '⚡ 자동 탐색'은 되는 엔진을 빨리 찾는 것이 목적이라 한도가 따로입니다.
    #   auto-attempt-seconds  엔진 하나를 기다리는 한도 (넘으면 다음 엔진)
    #   auto-budget-seconds   폴오버 전체에 주는 시간 예산 (넘으면 중단)
    auto-attempt-seconds: ${AI_AUTO_ATTEMPT_SECONDS:60}
    auto-budget-seconds: ${AI_AUTO_BUDGET_SECONDS:180}
    # 유료 회원의 하루(KST) AI 리포트 한도 — 유료 API 비용 상한. 운영자는 한도 없음, 무료 회원은 쓸 수 없음.
    daily-limit: ${AI_DAILY_LIMIT:20}
    # 이 배포에서 쓸 엔진 ID(쉼표로 구분, ADR 0014). 비우면 키가 있는 엔진을 모두 씁니다(기본·로컬).
    # 모르는 ID가 있으면 기동하지 않습니다. auto는 넣지 않습니다 — 허용한 엔진 중 키가 있는 것이 둘 이상이면 켜집니다.
    engines: ${AI_ENGINES:}
    # 데모 열람(ADR 0013) 방문자 전체가 함께 쓰는 하루(KST) AI 리포트 한도 — 메모리에서 셉니다(재시작하면 0부터).
    demo-daily-limit: ${AI_DEMO_DAILY_LIMIT:20}

logging:
  level:
    root: INFO
    com.macrodash: ${LOG_LEVEL:INFO}
