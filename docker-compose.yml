# =============================================================================
# docker-compose.yml
# 로컬 실행용 전체 스택.
#
#   postgres  저장 계층 (구버전 SQLite 파일을 대체)
#   collector 수집기 (Python/FastAPI) — 외부 소스에서 받아 PostgreSQL에 적재
#   backend   API (Java/Spring Boot) — 저장본 읽기·분석·인증
#   frontend  화면 (Next.js)
#
# 실행:  make up   (빌드·기동 뒤 대기 중인 스키마까지 적용 — docker compose up만 쓰면 새 스키마가 빠질 수 있음, QA-016)
# 접속:  http://localhost:<FRONTEND_PORT>(이 저장소 기본 3002)  — 로그인 화면 없이 운영자 계정으로 열립니다(ADR 0016). 계정은 처음 기동할 때
#        .env의 OWNER_EMAIL·APP_PASSWORD로 만듭니다('make setup'이 비밀번호를 만들어 줌). 로그인을 거치려면 LOCAL_NO_LOGIN=false
#
# [포트를 어디까지 여는가]
# 네 포트 모두 **이 맥에서만**(127.0.0.1) 엽니다.
# 예전에는 모두 모든 네트워크 인터페이스에 열려 있어서, 같은 와이파이에 있는
# 다른 기기가 비밀번호 macro/macro로 DB에 붙거나, 로그인 없이 수집기 API를
# 호출해 시장 데이터를 받아갈 수 있었습니다. 카페·공용 와이파이에서는 그대로
# 노출입니다. 이들은 컨테이너끼리 내부 네트워크로 통신하므로 밖에 열 이유가
# 없습니다(호스트에서 쓰는 make db·make status는 127.0.0.1로 그대로 됩니다).
#
# 화면(frontend)·API(backend)도 127.0.0.1 고정입니다. 로컬은 로그인 없이 운영자로 열리므로, 다른 기기에
# 열면 같은 와이파이의 누구나 운영자가 됩니다 — 그래서 휴대폰 접속(예전 WEB_BIND_HOST=0.0.0.0)은 없앴습니다.
# 로그인 화면은 AWS 개인용 서버(compose.aws.yml, ADR 0019)와 QA 스택(scripts/qa/docker-compose.qa.yml)에 그대로 남습니다
# — 두 덧붙임이 DASHBOARD_LOCAL_NO_LOGIN을 "false"로 고정합니다.
# =============================================================================

# 컨테이너 로그는 기본이 무제한(json-file)입니다. 서비스마다 10MB×3으로 돌립니다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 앱 컨테이너(수집기·백엔드·화면)는 root가 아닌 사용자로 돌고 커널 권한이 필요 없습니다. 모두 버리고 권한 상승도
# 막아, 컨테이너 안의 코드가 뚫려도 할 수 있는 일을 줄입니다. postgres는 기동할 때 사용자 전환이 필요해 빼둡니다.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    restart: unless-stopped
    logging: *logging
    # 메모리 상한을 두지 않으면 JVM이 Docker VM 전체(수 GB)의 70%를 힙 상한으로 잡고, 다른
    # 프로젝트의 컨테이너와 한 VM을 나눠 쓰다 OOM 킬러가 아무 컨테이너나(postgres 포함) 고릅니다.
    mem_limit: 512m
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-macro}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-macro}
      POSTGRES_DB: ${DATABASE_NAME:-macrodash}
      # 한국어 데이터가 많아 UTF-8 로케일을 명시합니다.
      LANG: C.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 최초 기동 시 기본 스키마(V1)만 만듭니다. 이후 버전(V2~)은 수집기가 기동할 때
      # 번호 순서로 적용합니다(collector/app/migrations.py). 디렉터리를 통째로 넣으면
      # 이름 순으로 실행돼 V10이 V2보다 먼저 돕니다.
      - ./db/migrations/V1__init.sql:/docker-entrypoint-initdb.d/V1__init.sql:ro
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    healthcheck:
      # -h localhost: 소켓만 보면 최초 initdb(TCP가 아직 안 열림) 중에도 healthy로 나와
      # 수집기·백엔드가 몇 초 동안 연결 거부를 받습니다.
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DATABASE_USER:-macro} -d ${DATABASE_NAME:-macrodash}"]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    <<: *hardening
    restart: unless-stopped
    logging: *logging
    # pandas·pykrx·yfinance·lxml을 올린 상주 메모리가 637MiB(기동 25분 뒤 실측)입니다. 768m에서는
    # 13F XML(6MB) 파싱 때 OOM-kill(종료 코드 137) 여지가 있어 1g로 둡니다.
    mem_limit: 1g
    build: ./collector
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-macro}:${DATABASE_PASSWORD:-macro}@postgres:5432/${DATABASE_NAME:-macrodash}
      COLLECTOR_SCHEDULER: "${COLLECTOR_SCHEDULER:-true}"
      COLLECTOR_FAST_INTERVAL: "${COLLECTOR_FAST_INTERVAL:-300}"
      COLLECTOR_SLOW_INTERVAL: "${COLLECTOR_SLOW_INTERVAL:-3600}"
      COLLECTOR_WEEKLY_INTERVAL: "${COLLECTOR_WEEKLY_INTERVAL:-43200}"
      COLLECTOR_RUN_LOG_RETENTION_DAYS: "${COLLECTOR_RUN_LOG_RETENTION_DAYS:-90}"
      COLLECTOR_API_TOKEN: "${COLLECTOR_API_TOKEN:-}"
      # 토큰이 비면 수집기는 뜨지 않습니다. 아래를 1로 두면 경고만 남기고 뜹니다(.env.example 참고).
      COLLECTOR_ALLOW_NO_TOKEN: "${COLLECTOR_ALLOW_NO_TOKEN:-}"
      # Host 허용 목록(쉼표). 비우면 localhost·127.0.0.1·collector 기본 목록.
      COLLECTOR_ALLOWED_HOSTS: "${COLLECTOR_ALLOWED_HOSTS:-}"
      COLLECTOR_INIT_SCHEMA: "true"
      MACRO_MIGRATIONS_DIR: /app/db/migrations
      # 외부 API 키 — 없으면 해당 기능만 비활성화됩니다.
      FRED_API_KEY: "${FRED_API_KEY:-}"
      KRX_API_KEY: "${KRX_API_KEY:-}"
      # pykrx 로그인 조회(선택). 없으면 비로그인으로 동작합니다.
      KRX_ID: "${KRX_ID:-}"
      KRX_PW: "${KRX_PW:-}"
      KIS_APP_KEY: "${KIS_APP_KEY:-}"
      KIS_APP_SECRET: "${KIS_APP_SECRET:-}"
      LS_APP_KEY: "${LS_APP_KEY:-}"
      LS_APP_SECRET: "${LS_APP_SECRET:-}"
      TOSS_CLIENT_ID: "${TOSS_CLIENT_ID:-}"
      TOSS_CLIENT_SECRET: "${TOSS_CLIENT_SECRET:-}"
      # SEC EDGAR는 연락처 없는 요청을 403으로 막습니다(13F 메뉴).
      SEC_USER_AGENT: "${SEC_USER_AGENT:-}"
      # 모의 매매 13F 트랙레코드 수집의 실행당 공시 예산. 비우면 400(collector/app/settings.py).
      TRACK_RECORD_FETCH_BUDGET: "${TRACK_RECORD_FETCH_BUDGET:-}"
      # 모의 매매 미국 재무(SEC XBRL) 수집의 실행당 companyfacts 요청(CIK) 예산. 비우면 200(collector/app/settings.py).
      FUNDAMENTALS_FETCH_BUDGET: "${FUNDAMENTALS_FETCH_BUDGET:-}"
      # 모의 매매 미국 실적 일정(yfinance) 수집의 실행당 종목 예산. 비우면 120(collector/app/settings.py).
      US_CALENDAR_EARNINGS_BUDGET: "${US_CALENDAR_EARNINGS_BUDGET:-}"
      # 모의 매매 어닝 서프라이즈(yfinance) 수집의 실행당 종목 예산. 비우면 100(collector/app/settings.py).
      EARNINGS_SURPRISE_BUDGET: "${EARNINGS_SURPRISE_BUDGET:-}"
      # 국내 공공 API — 공공데이터포털 키 하나로 특일정보·주식시세를 씁니다.
      DATA_GO_KR_SERVICE_KEY: "${DATA_GO_KR_SERVICE_KEY:-}"
      DART_API_KEY: "${DART_API_KEY:-}"
      # (선택) 금융위 주식시세 주소 직접 지정 — 기본은 활용가이드의 getStockPriceInfo_V2
      FSC_STOCK_PRICE_URL: "${FSC_STOCK_PRICE_URL:-}"
    volumes:
      - ./db/migrations:/app/db/migrations:ro
    ports:
      - "127.0.0.1:${COLLECTOR_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    <<: *hardening
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-macrodash}
      DATABASE_USER: ${DATABASE_USER:-macro}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-macro}
      COLLECTOR_URL: http://collector:8000
      COLLECTOR_API_TOKEN: "${COLLECTOR_API_TOKEN:-}"
      DASHBOARD_READ_MODE: "${DASHBOARD_READ_MODE:-auto}"
      # 비싼 계산 동시 실행 상한(QA-131). 0(기본)이면 자동 = 컨테이너가 보는 코어 수의 절반, 최소 1
      COMPUTE_MAX_CONCURRENT: "${COMPUTE_MAX_CONCURRENT:-0}"
      # 기본값을 두지 않습니다. 비었거나 옛 공개 기본값이면 운영자 계정을 만들지 않습니다(로그인도, 로그인 없는 열람도 안 됨).
      APP_PASSWORD: "${APP_PASSWORD:-}"
      OWNER_EMAIL: "${OWNER_EMAIL:-}"
      # 로컬은 로그인 없이 운영자 계정으로 엽니다(ADR 0016). 백엔드는 Host가 localhost·127.0.0.1·::1이고 프록시 헤더가
      # 없는 요청에만 적용합니다. .env에 LOCAL_NO_LOGIN=false면 로그인 화면. AWS·QA 덧붙임은 "false"로 고정합니다.
      DASHBOARD_LOCAL_NO_LOGIN: "${LOCAL_NO_LOGIN:-true}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      AI_DAILY_LIMIT: "${AI_DAILY_LIMIT:-20}"
      # 비워 두면 FRONTEND_PORT를 따라갑니다. 예전에는 3000으로 고정이라 포트만 바꾸면
      # 로그인(CORS)이 조용히 막혔습니다.
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}"
      # 화면 포트 — 백엔드의 CORS·출처 검사가 이 포트에서 연 화면의 요청을 받습니다.
      FRONTEND_PORT: "${FRONTEND_PORT:-3000}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-240}"
      # .env.example에 적혀 있었지만 전달되지 않아 값을 바꿔도 무시되던 두 항목
      AI_AUTO_ATTEMPT_SECONDS: "${AI_AUTO_ATTEMPT_SECONDS:-60}"
      AI_AUTO_BUDGET_SECONDS: "${AI_AUTO_BUDGET_SECONDS:-180}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      # 쓸 엔진 허용 목록(ADR 0014). 비면 키가 있는 엔진을 모두 씀(기본)
      AI_ENGINES: "${AI_ENGINES:-}"
      # 🧪 모의 매매 정기 작업(리스크 점검·결정·출발일 종가). false면 멈춥니다(수동 실행 버튼은 그대로). 여기서 넘기지 않으면 .env의 값이 무시됩니다.
      PAPER_ENABLED: "${PAPER_ENABLED:-true}"
    ports:
      # 이 맥에서만 — 로그인 없이 운영자로 받는 API라 다른 기기에 열지 않습니다(위 머리말).
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    <<: *hardening
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    build:
      context: ./frontend
      args:
        # 화면은 실행 시점에 "열린 호스트 + 백엔드 포트"로 백엔드를 찾습니다(localhost로 열면 localhost:8080).
        # 전체 주소를 고정해야 할 때(리버스 프록시)만 NEXT_PUBLIC_API_BASE를
        # 적으세요. 둘 다 빌드할 때 번들에 들어가므로 바꾼 뒤에는 make up(다시 빌드)이 필요합니다.
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-}"
        NEXT_PUBLIC_BACKEND_PORT: "${BACKEND_PORT:-8080}"
        # 'make up'이 현재 브랜치@커밋을 넣어 줍니다. 직접 docker compose로
        # 띄우면 비어 있고, 그때는 화면에 버전이 표시되지 않습니다.
        NEXT_PUBLIC_APP_VERSION: "${APP_VERSION:-}"
        # 그 커밋의 날짜(KST, YYYY-MM-DD). 화면 왼쪽 아래 '최종 수정'에 쓰입니다. 비어 있으면 표시하지 않습니다.
        NEXT_PUBLIC_APP_UPDATED: "${APP_UPDATED:-}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
