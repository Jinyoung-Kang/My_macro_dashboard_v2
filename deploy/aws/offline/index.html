<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>운영 시간 외</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#16181d; --muted:#5d6470; --line:#d9dce1; --accent:#2b59c3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1a1d23; --text:#e8eaee; --muted:#9aa1ad; --line:#2d323b; --accent:#6b93ef; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text);
         font:15px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         word-break:keep-all; overflow-wrap:break-word; }
  main { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
  h1 { font-size:21px; margin:0 0 8px; text-wrap:balance; }
  /* 문장마다 새 줄, 줄 안에서는 낱말 사이에서만 줄바꿈 */
  .ln { display:block; text-wrap:pretty; }
  .u { white-space:nowrap; }
  p { margin:6px 0; color:var(--muted); }
  .hours { margin:16px 0; padding:12px 14px; border-radius:8px; background:var(--bg); color:var(--text); font-weight:600; }
  #now { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>지금은 서버가 꺼져 있는 시간입니다</h1>
  <p><span class="ln">비용을 아끼려고 정해진 시간에만 켜 둡니다.</span><span class="ln">켜져 있는 시간에 같은 주소로 다시 접속해 주세요.</span></p>
  <p class="hours">켜져 있는 시간: <span class="u">매일 21:55–08:00</span> <span class="u">(토요일은 10:00까지)</span> <span class="u">(한국 시간)</span></p>
  <p>현재 한국 시간: <span id="now" class="u">—</span></p>
  <p>운영자는 그 밖의 시간에 서버를 직접 켜서 볼 수 있습니다.</p>
</main>
<script>
  (function () {
    try {
      var f = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", weekday: "short", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
      document.getElementById("now").textContent = f.format(new Date());
    } catch (e) { /* 표시만 — 실패해도 안내는 그대로 */ }
  })();
</script>
</body>
</html>
