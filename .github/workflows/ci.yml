name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에서 새 푸시가 오면 이전 실행을 취소합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 작업 토큰은 코드 읽기만. 이 워크플로에는 저장소·패키지에 쓰는 단계가 없습니다(기본 권한에 기대지 않음).
permissions:
  contents: read

jobs:
  collector:
    name: 수집기 (Python)
    # ubuntu-latest가 26.04로 옮겨 가는 중이고(2026-10) 26.04 저장소에는 postgresql-client-16이 없습니다 — 아래 '16판' 단계가
    # 서버와 같은 판을 쓰도록 24.04에 고정합니다(24.04 이미지에는 PostgreSQL 16이 깔려 있음).
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: macro
          POSTGRES_DB: macrodash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U macro -d macrodash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            collector/requirements.txt
            collector/requirements-dev.txt
            collector/constraints.txt

      - name: 의존성 설치
        working-directory: collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      # 로컬에서 쓰는 린터(ruff, requirements-dev.txt에 버전 고정)를 CI에서도 돌립니다.
      - name: 린트 (ruff)
        working-directory: collector
        run: ruff check app tests

      # 알려진 취약점 점검. 실패해도 빌드를 막지 않고 경고로 남깁니다 — 고치는 쪽이 사람이고,
      # 새 공시가 올라올 때마다 모든 PR이 빨개지면 아무도 보지 않게 됩니다.
      # 감사 대상은 이미지(Dockerfile)·위 설치와 같은 constraints.txt의 고정판입니다. `-r requirements.txt`는
      # 임시 환경에서 constraints 없이 다시 해석해 그날의 최신 간접 의존성을 검사했습니다 — 고정판에 공시가 나고
      # 상위 판에서 고쳐지면 경고가 뜨지 않았습니다(QA-108). --no-deps·--disable-pip: 다시 해석·설치하지 않음.
      - name: 취약점 점검 (pip-audit)
        working-directory: collector
        continue-on-error: true
        run: pip install pip-audit==2.10.1 && pip-audit --disable-pip --no-deps -r constraints.txt

      - name: 스키마 적용 (번호 순서)
        env:
          PGPASSWORD: macro
        run: |
          for f in $(ls db/migrations/V*__*.sql | sort -t V -k 2 -n); do
            psql -h localhost -U macro -d macrodash_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # 백업·복원 시험(test_db_scripts.py)은 러너의 psql·pg_dump를 씁니다. 더 새 판(17+)이 기본이면 백업에
      # `SET transaction_timeout`이 들어가 시험 서버(16)의 복원이 실패합니다(2026-10-29 CI, ubuntu-26.04 러너). 서버와 같은 16판으로 맞춥니다.
      - name: psql·pg_dump를 시험 서버와 같은 16판으로
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          fi
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version

      - name: 테스트
        working-directory: collector
        env:
          # 저장 계층 테스트는 실제 PostgreSQL을 씁니다.
          TEST_DATABASE_URL: postgresql://macro:macro@localhost:5432/macrodash_test
        run: python -m pytest tests -q

      # 공개 주소 잠금화면(ADR 0019 결정 16) — 표준 라이브러리만 쓰는 deploy/aws/gate의 시험(make test-gate와 같음)
      - name: 잠금화면 시험 (gate)
        run: python3 -I -m unittest discover -s deploy/aws/gate

  backend:
    name: 백엔드 (Java)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: macro
          POSTGRES_DB: macrodash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U macro -d macrodash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 스키마 적용 (번호 순서)
        env:
          PGPASSWORD: macro
        run: |
          for f in $(ls db/migrations/V*__*.sql | sort -t V -k 2 -n); do
            psql -h localhost -U macro -d macrodash_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: 빌드 및 테스트
        working-directory: backend
        env:
          # 통합 테스트가 실제 DB를 씁니다. 수집기는 없어도 되며,
          # 없을 때도 화면이 뜨는지까지 테스트가 확인합니다.
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/macrodash_test
          DATABASE_USER: macro
          DATABASE_PASSWORD: macro
        run: mvn -B verify

  frontend:
    name: 프런트엔드 (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # 시장 달력·표기·실행 대기 등 화면 로직 자가 검증 (src/lib/__checks__)
      - name: 자가 검증
        working-directory: frontend
        run: npm run check

      # 훅을 실제로 렌더링해 보는 테스트 (vitest + Testing Library, src/**/__tests__)
      - name: 훅 테스트
        working-directory: frontend
        run: npm test

      - name: 린트
        working-directory: frontend
        run: npm run lint

      - name: 취약점 점검 (npm audit)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: 빌드 (타입 검사 포함)
        working-directory: frontend
        run: npm run build

  datasets-parity:
    name: 데이터셋 이름 대조
    runs-on: ubuntu-latest
    # 수집기(Python)와 백엔드(Java)가 같은 데이터셋 문자열을 쓰는지 확인합니다.
    # 어긋나면 "수집은 되는데 화면에는 안 보이는" 버그가 생깁니다.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 대조 테스트
        working-directory: backend
        run: mvn -B -Dtest=DatasetsParityTest -DfailIfNoTests=false test

  images:
    name: 도커 이미지 빌드
    runs-on: ubuntu-latest
    # make up이 쓰는 세 이미지(수집기·백엔드·프런트)가 지금 코드로 빌드되는지 확인합니다.
    # 위 잡들은 이미지 없이 소스로 돌아서, Dockerfile이나 운영 이미지 의존성만 깨진 경우
    # (예: 프레임워크를 올린 뒤 이미지 안의 빌드 단계 실패)를 잡지 못합니다.
    steps:
      - uses: actions/checkout@v7

      - name: AWS 덧붙임 해석 (compose.aws.yml · deploy/aws/Caddyfile)
        # AWS 개인용 서버(ADR 0019)에서만 쓰는 덧붙임이 기반 compose와 합쳐 해석되는지(문법·!override 태그)와, 닫아 둔 설정이
        # 풀리지 않았는지 봅니다: 공개 포트는 모두 127.0.0.1이고 예외는 앞단 caddy의 공개 리스너 8301 하나(CloudFront 원본 — ADR 0019 결정 16,
        # 보안 그룹이 CloudFront 대역만 들임), 잠금화면 gate는 포트를 열지 않고 비밀값이 비면 해석부터 실패, postgres 컨테이너 유지(매일 아침 정지에 30초 여유),
        # 국면 판정 기록 23시(가동 창 21:55~08:00 안), 로그인 유지
        # (로컬의 로그인 없는 운영자 열람 끔 — ADR 0016), Secure 쿠키 기본값, 메일 끔, 허용 출처·메일 링크는 터널 주소,
        # 데모 열람 토큰 없음, 화면은 같은 출처(/). 로컬 실행에는 쓰지 않는 파일이라 다른 잡이 읽지 않습니다. 값은 모두
        # 가짜(비밀값 없음)이고, --env-file /dev/null로 다른 값은 읽지 않습니다.
        # 아래 env는 서버 .env에 로컬 값이 섞여 들어온 경우를 흉내 냅니다 — 덧붙임이 이 값을 덮어써야 통과합니다.
        # COOKIE_SECURE는 .env로 바꿀 수 있게 둔 값(브라우저가 쿠키를 받지 못할 때의 되돌림)이라 넣지 않고 기본값(true)과
        # 바꿀 수 있는지만 봅니다.
        env:
          DATABASE_USER: ci
          DATABASE_PASSWORD: ci
          LOCAL_NO_LOGIN: "true"
          MAIL_HOST: smtp.ci.example
          FRONTEND_ORIGIN: http://localhost:3002
          PUBLIC_URL: http://localhost:3002
          NEXT_PUBLIC_API_BASE: http://localhost:8082
          FRONTEND_PORT: "3002"
          DEMO_VIEWER_TOKEN: ci-demo-viewer-token-0123456789abcdef
          # 공개 주소(ADR 0019 결정 16)의 필수 값 — 가짜. 비면 해석이 실패하는지는 아래에서 따로 봄
          ORIGIN_SECRET: ci-origin-secret-0123456789abcdef
          GATE_SECRET: ci-gate-secret-0123456789abcdef0123456789
          GATE_CODES: "ci:scrypt-fake-hash"
        run: |
          docker compose --env-file /dev/null -f docker-compose.yml -f compose.aws.yml config -q
          docker compose --env-file /dev/null -f docker-compose.yml -f compose.aws.yml config --format json > "$RUNNER_TEMP/aws.json"
          jq -e '[.services | to_entries[] | select(.key != "caddy") | .value.ports[]?] | length > 0 and all(.host_ip == "127.0.0.1")' "$RUNNER_TEMP/aws.json"
          jq -e '.services.caddy.ports | length == 2
                 and any(.host_ip == "127.0.0.1" and .published == "8201" and .target == 8201)
                 and any(((.host_ip // "") == "" or .host_ip == "0.0.0.0") and .published == "8301" and .target == 8301)' "$RUNNER_TEMP/aws.json"
          jq -e '.services.caddy.volumes | any(.target == "/etc/caddy/Caddyfile" and (.source | endswith("/deploy/aws/Caddyfile")))
                 and any(.target == "/etc/caddy/trusted_proxies.caddy" and (.source | endswith("/deploy/aws/trusted_proxies.caddy")))' "$RUNNER_TEMP/aws.json"
          jq -e '.services.caddy.environment.ORIGIN_SECRET == "ci-origin-secret-0123456789abcdef"' "$RUNNER_TEMP/aws.json"
          jq -e '.services.gate | ((.ports // []) | length == 0) and .read_only == true and .environment.GATE_COOKIE_SECURE == "true"' "$RUNNER_TEMP/aws.json"
          for name in ORIGIN_SECRET GATE_SECRET GATE_CODES; do
            if env "$name=" docker compose --env-file /dev/null -f docker-compose.yml -f compose.aws.yml config -q 2>/dev/null; then
              echo "::error::$name가 비어도 해석됨 — 공개 주소가 비밀값 없이 뜰 수 있음"; exit 1
            fi
          done
          jq -e '.services.postgres | (.image | startswith("postgres:")) and .stop_grace_period == "30s"' "$RUNNER_TEMP/aws.json"
          jq -e '.services.backend.environment | .COOKIE_SECURE == "true" and .DASHBOARD_LOCAL_NO_LOGIN == "false" and .MAIL_HOST == ""' "$RUNNER_TEMP/aws.json"
          jq -e '.services.backend.environment | .FRONTEND_ORIGIN == "http://localhost:8201,http://127.0.0.1:8201,http://localhost:8201" and .FRONTEND_PORT == "8201" and .PUBLIC_URL == "http://localhost:8201" and .SERVER_FORWARDHEADERSSTRATEGY == "native"' "$RUNNER_TEMP/aws.json"
          PUBLIC_ORIGIN=https://dci.cloudfront.net docker compose --env-file /dev/null -f docker-compose.yml -f compose.aws.yml config --format json \
            | jq -e '.services.backend.environment.FRONTEND_ORIGIN == "http://localhost:8201,http://127.0.0.1:8201,https://dci.cloudfront.net"'
          jq -e '.services.backend.environment | has("DASHBOARD_DEMO_VIEWER_TOKEN") | not' "$RUNNER_TEMP/aws.json"
          jq -e '.services.backend.environment.DASHBOARD_SCHEDULER_REGIMERECORDHOURKST == "23"' "$RUNNER_TEMP/aws.json"
          jq -e '.services.frontend.build.args.NEXT_PUBLIC_API_BASE == "/"' "$RUNNER_TEMP/aws.json"
          COOKIE_SECURE=false docker compose --env-file /dev/null -f docker-compose.yml -f compose.aws.yml config --format json \
            | jq -e '.services.backend.environment.COOKIE_SECURE == "false"'
          # Caddyfile 문법 — compose와 같은 이미지로 검사만 합니다(네트워크·포트를 열지 않음). CloudFront 대역 파일은 가짜 한 줄.
          echo "trusted_proxies static 10.0.0.0/8" > "$RUNNER_TEMP/trusted_proxies.caddy"
          docker run --rm -e ORIGIN_SECRET=ci-origin-secret -v "$PWD/deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/trusted_proxies.caddy:/etc/caddy/trusted_proxies.caddy:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: 로컬·QA compose 해석 (docker-compose.yml · scripts/qa/docker-compose.qa.yml)
        # 로컬은 로그인 없이 운영자로 열리므로(ADR 0016) 포트가 루프백 밖으로 열리면 같은 와이파이의 누구나 운영자가 됩니다.
        # 기반 파일만으로 네 포트가 모두 127.0.0.1에 열리는지, 로그인 없는 열람이 기본으로 켜지고 LOCAL_NO_LOGIN=false로
        # 끌 수 있는지, QA 덧붙임은 셸에 LOCAL_NO_LOGIN=true가 있어도 끄는지(auth-probe.sh가 401을 기대) 봅니다.
        run: |
          docker compose --env-file /dev/null -f docker-compose.yml config -q
          docker compose --env-file /dev/null -f docker-compose.yml config --format json > "$RUNNER_TEMP/local.json"
          jq -e '[.services.backend.ports[]?, .services.frontend.ports[]?] | length == 2 and all(.host_ip == "127.0.0.1")' "$RUNNER_TEMP/local.json"
          jq -e '[.services[].ports[]?] | length > 0 and all(.host_ip == "127.0.0.1")' "$RUNNER_TEMP/local.json"
          jq -e '.services.backend.environment.DASHBOARD_LOCAL_NO_LOGIN == "true"' "$RUNNER_TEMP/local.json"
          LOCAL_NO_LOGIN=false docker compose --env-file /dev/null -f docker-compose.yml config --format json \
            | jq -e '.services.backend.environment.DASHBOARD_LOCAL_NO_LOGIN == "false"'
          LOCAL_NO_LOGIN=true docker compose --env-file /dev/null -f docker-compose.yml -f scripts/qa/docker-compose.qa.yml \
            config --format json > "$RUNNER_TEMP/qa.json"
          jq -e '.services.backend.environment.DASHBOARD_LOCAL_NO_LOGIN == "false"' "$RUNNER_TEMP/qa.json"
          jq -e '[.services[].ports[]?] | length > 0 and all(.host_ip == "127.0.0.1")' "$RUNNER_TEMP/qa.json"

      - name: 이미지 빌드 (docker compose build)
        run: docker compose build

      - name: 잠금화면 이미지 빌드 (deploy/aws/gate — 서버 compose.aws.yml에만 있는 서비스)
        run: docker build -q -t gate-ci deploy/aws/gate

  secrets:
    name: 비밀값 검사 (gitleaks)
    runs-on: ubuntu-latest
    # 저장소는 공개입니다. 키가 한 번이라도 커밋되면 지워도 이력에 남고 누구나 클론할 수 있습니다. 그래서 전체 이력을 봅니다.
    # gitleaks-action은 첫 push에서 '첫 커밋^' 범위를 만들다 git 오류로 실패하므로 공식 이미지를 직접 씁니다
    # (roadrail·wakeline과 같은 방식·같은 판). 진짜 비밀이 아닌 발견은 .gitleaksignore에 지문으로 하나씩 둡니다.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 전체 이력 검사
        # 태그는 바뀔 수 있어 이미지 digest(다중 아키텍처 목록)로 고정합니다. 저장소 전체를 마운트하는 이미지입니다.
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
